name: Публикация румынского тренажёра

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Проверить данные
        run: |
          python3 -m json.tool data/words-ro.json >/dev/null
          python3 -m json.tool data/alphabet-ro.json >/dev/null
          python3 -m json.tool data/mnemonics-ro.json >/dev/null
      - name: Собрать сайт
        run: |
          mkdir -p _site
          cp index.html style.css app.js sw.js manifest.json _site/
          cp -r icons data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
